# Cloudflare Tunnel 뒤에서는 $remote_addr가 cloudflared 주소라 모든 방문자가 같은 IP로 보인다.
# CF-Connecting-IP가 있으면 그걸 실제 IP로 쓴다 (레이트 리밋용).
map $http_cf_connecting_ip $client_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # SPA fallback (+ SSI로 경로별 메타 태그 주입)
    location / {
        ssi on;
        ssi_silent_errors on;
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # F4: SSI 서브요청 전용 — 외부에서 직접 접근 불가(internal)
    # 서브요청에서도 $request_uri는 원래 요청 경로(/projects/3 등)를 가리킨다.
    location = /__meta {
        internal;
        proxy_pass http://backend:8000/api/meta/ssi;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Proxy API to backend — 브라우저 주소창 직접 접근 차단 (보안 경계는 아님: 헤더는 누구나 붙일 수 있다)
    location /api/ {
        if ($http_x_requested_from != "imjemin-frontend") {
            return 403 "CANT";
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        client_max_body_size 11M;
        # PDF 생성(캐시 없음)은 Pi에서 몇 초 걸릴 수 있다
        proxy_read_timeout 60s;
    }

    # Proxy uploaded images to backend static files
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
